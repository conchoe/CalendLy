<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalendLy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>

<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="text-center mb-8">
            <div
                class="bg-blue-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <i class="fa-solid fa-calendar-check text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-800">Calendar AI</h1>
            <p class="text-slate-500 mt-2">Paste your schedule, syllabus, or shifts below.</p>
        </div>

        <div class="space-y-4">
            <textarea id="text"
                class="w-full h-64 p-4 rounded-xl border border-slate-200 focus:ring-4 focus:ring-blue-100 focus:border-blue-500 transition-all outline-none text-slate-700 placeholder:text-slate-400"
                placeholder="Example: Gym every Mon/Wed at 6pm until May..."></textarea>

            <button onclick="process()" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl transition-all flex items-center justify-center gap-3 shadow-lg shadow-blue-100 active:scale-[0.98]">
                <span id="btnText">Generate New Calendar</span>
                <i id="spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </div>

        <div id="status" class="mt-6 text-center text-sm font-medium hidden">
            <div id="statusBox" class="p-4 rounded-lg"></div>
        </div>
    </div>

    <script>
        async function process() {
            const text = document.getElementById('text').value;
            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const status = document.getElementById('status');
            const statusBox = document.getElementById('statusBox');

            if (!text.trim()) {
                alert("Please paste some text first!");
                return;
            }

            // UI Loading State
            btn.disabled = true;
            btnText.innerText = "AI is Thinking...";
            spinner.classList.remove('hidden');
            status.classList.remove('hidden');
            statusBox.innerText = "Analyzing dates and times...";
            statusBox.className = "p-4 rounded-lg bg-blue-50 text-blue-700 animate-pulse";

            try {
                const res = await fetch('/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                const data = await res.json();

                if (data.auth_url) {
                    statusBox.innerText = "Success! Redirecting to Google...";
                    statusBox.className = "p-4 rounded-lg bg-green-50 text-green-700";
                    // Brief delay so the user sees the success message
                    setTimeout(() => {
                        window.location.href = data.auth_url;
                    }, 1000);
                } else {
                    throw new Error(data.error || "Something went wrong");
                }
            } catch (err) {
                btn.disabled = false;
                btnText.innerText = "Try Again";
                spinner.classList.add('hidden');
                statusBox.innerText = "Error: " + err.message;
                statusBox.className = "p-4 rounded-lg bg-red-50 text-red-700";
            }
        }
    </script>
</body>

</html>
